<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      安全基线：只允许加载本地资源；connect-src 放开 ws/http 是为了 vite 的 HMR，
      生产构建下不会用到。不加载任何远程脚本。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: http://localhost:*"
    />
    <title>dbstudio</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <span id="app-title">dbstudio</span>
        <span id="app-subtitle">元数据浏览（虚拟化 + 懒加载）</span>
        <span class="spacer"></span>
        <button id="btn-new-connection" type="button">＋ 新建连接</button>
      </header>

      <main id="layout">
        <!-- 左：元数据树。role=tree 让屏幕阅读器能正确播报层级 -->
        <section id="tree-pane" aria-label="数据库对象树">
          <div id="tree-toolbar">
            <span id="tree-summary">未连接</span>
            <button id="btn-refresh" type="button" title="重新加载连接列表">↻</button>
          </div>
          <!--
            虚拟滚动结构：
              #tree-viewport  负责滚动与裁剪
              #tree-spacer    把滚动高度撑到「总行数 × 行高」，让滚动条比例正确
              #tree-rows      只放可视区的行，用 transform 定位到正确位置
          -->
          <div id="tree-viewport" tabindex="0">
            <div id="tree-spacer"></div>
            <div id="tree-rows" role="tree" aria-label="数据库元数据" aria-multiselectable="false"></div>
          </div>
        </section>

        <!-- 右：详情 / 结果集 -->
        <section id="detail-pane" aria-label="对象详情与结果集">
          <div id="detail-empty">在左侧选择一张表或视图，或在上方执行 SQL。</div>
          <div id="detail-content" hidden></div>
          <!--
            结果区：多标签容器。由 tabs.ts 接管。
               #result-tabbar     标签栏（横向可滚动），右侧固定「导出全部」按钮
               #result-stack      标签内容栈：每个标签一个 .tab-pane，靠 hidden 切换
               每个标签内部是一个独立的 ResultGrid 实例（grid.ts），
               互不干扰：各自的 cursor / 排序 / 列宽 / 脏数据。
          -->
          <div id="result-area" hidden>
            <div id="result-tabbar">
              <div id="result-tabs-scroll" role="tablist" aria-label="结果集标签"></div>
              <button id="btn-export-all" type="button" disabled
                      title="导出当前标签的全部行（会重新执行一次该查询）">导出全部</button>
            </div>
            <div id="result-stack"></div>
            <div id="result-tabs-empty">在左侧点击一张表，或执行 SQL，结果会以新标签打开。</div>

            <!--
              结果工具条（E1-C 追加）：作用于**当前标签**的已加载数据。
              与右上角「导出全部」区分：这里导出"已加载行"，不重查；
              筛选则相反——必须**重新查询**（拼 WHERE 重跑），
              不能在前端过滤页缓存，否则只过滤了"看得见的行"，静默出错。
            -->
            <div id="result-tools" hidden>
              <label class="result-tools-label" for="btn-export-format">导出（已加载行）</label>
              <select id="btn-export-format"
                      title="导出当前标签已加载的行；需要全量请用右上角「导出全部」">
                <option value="csv">CSV</option>
                <option value="json">JSON</option>
                <option value="insert">INSERT SQL</option>
                <option value="markdown">Markdown</option>
              </select>
              <button id="btn-filter-toggle" type="button" title="按条件筛选（会重新查询）">筛选…</button>
              <div id="filter-bar" hidden>
                <input id="filter-input" type="text" spellcheck="false"
                       placeholder="例：status = 'active'（多条件用 AND 分隔）"
                       aria-label="筛选条件" />
                <button id="btn-filter-apply" type="button">应用筛选</button>
                <button id="btn-filter-clear" type="button">清除</button>
                <span id="filter-hint" class="result-tools-hint"
                      title="筛选是在数据库端重新查询，不是在前端过滤已加载的行">筛选会重新查询整表</span>
              </div>
            </div>
          </div>

          <!--
            ER 图面板（E1-C 追加）：由 er-diagram.ts 接管内部 SVG。
            与结果区互斥显示（靠 hidden 切换）；零依赖手绘 SVG。
          -->
          <div id="er-area" hidden></div>
        </section>
      </main>

      <!-- 顶部 SQL 输入条。执行结果进右侧结果集网格。 -->
      <!--
        SQL 编辑器容器。具体 DOM（高亮层 + textarea + 工具栏 + 补全浮层 + 计划面板）
        全部由 SqlEditor 组件自己创建，这里只给一个挂载点。
        为什么不在 HTML 里写死：编辑器的内部结构（pre/textarea 对齐、浮层定位）
        与组件实现强耦合，放外面反而容易脱节。
      -->
      <div id="sql-editor-host"></div>

      <div id="status-bar" role="status" aria-live="polite"></div>
    </div>

    <!-- 新建连接对话框 -->
    <dialog id="dlg-connection">
      <form method="dialog" id="form-connection">
        <h2>新建连接</h2>
        <label class="field">
          <span>连接名</span>
          <input id="f-name" type="text" required placeholder="例如：本地测试库" />
        </label>
        <label class="field">
          <span>数据库类型</span>
          <select id="f-dialect" required></select>
        </label>
        <div id="f-dynamic"></div>
        <section id="test-diagnostics" class="test-diagnostics" hidden aria-live="polite">
          <div class="test-diagnostics-head">
            <span id="test-diagnostics-title">连接诊断</span>
            <span id="test-diagnostics-elapsed"></span>
          </div>
          <ol id="test-check-list" class="test-check-list"></ol>
          <div id="test-message" class="test-message" hidden>
            <p id="test-message-text"></p>
            <button id="btn-test-trust-host" type="button" hidden>核对指纹并信任…</button>
          </div>
        </section>
        <p id="f-error" class="error" hidden></p>
        <menu>
          <button id="btn-cancel" type="button" value="cancel">取消</button>
          <button id="btn-test" type="button">测试连接</button>
          <button id="btn-submit" type="submit">连接</button>
        </menu>
      </form>
    </dialog>

    <!-- SSH 首次连接 / 指纹变化确认。独立于连接表单，避免用 alert 拼文本。 -->
    <dialog id="dlg-ssh-host-key" class="confirm-dialog">
      <div class="confirm-body">
        <h2 id="ssh-key-title">确认 SSH 主机密钥</h2>
        <p id="ssh-key-warning" class="confirm-warning" hidden></p>
        <p id="ssh-key-intro" class="confirm-intro"></p>
        <dl class="fingerprint-details">
          <div>
            <dt>SSH 主机</dt>
            <dd id="ssh-key-host"></dd>
          </div>
          <div id="ssh-key-expected-row" hidden>
            <dt>已保存指纹</dt>
            <dd id="ssh-key-expected" class="fingerprint"></dd>
          </div>
          <div>
            <dt id="ssh-key-actual-label">实际指纹</dt>
            <dd id="ssh-key-actual" class="fingerprint"></dd>
          </div>
        </dl>
        <p id="ssh-key-guidance" class="confirm-guidance"></p>
        <menu>
          <button id="btn-ssh-key-cancel" type="button">取消</button>
          <button id="btn-ssh-key-trust" type="button">信任并继续</button>
        </menu>
      </div>
    </dialog>

    <!-- SQL 历史与收藏 -->
    <dialog id="dlg-sql-library" class="sql-library-dialog">
      <div class="sql-library">
        <header class="sql-library-head">
          <div>
            <h2>SQL 历史与收藏</h2>
            <p>历史自动保留最近 500 条；收藏不会被历史配额淘汰。</p>
          </div>
          <button id="btn-sql-library-close" type="button" aria-label="关闭">×</button>
        </header>
        <div class="sql-library-tabs" role="tablist" aria-label="SQL 库分类">
          <button id="tab-sql-history" type="button" role="tab" aria-selected="true">历史</button>
          <button id="tab-sql-saved" type="button" role="tab" aria-selected="false">收藏</button>
        </div>
        <div class="sql-library-toolbar">
          <input id="sql-library-search" type="search" placeholder="搜索 SQL、连接或收藏名"
                 aria-label="搜索 SQL 库" spellcheck="false" />
          <button id="btn-clear-sql-history" type="button">清空历史</button>
        </div>
        <div id="sql-library-list" class="sql-library-list" role="list"></div>
        <p id="sql-library-empty" class="sql-library-empty" hidden></p>
      </div>
    </dialog>

    <!-- 保存为收藏 / 重命名收藏 -->
    <dialog id="dlg-save-sql" class="confirm-dialog">
      <form id="form-save-sql" class="confirm-body" method="dialog">
        <h2 id="save-sql-title">保存为收藏</h2>
        <label class="field">
          <span>名称</span>
          <input id="f-save-sql-name" type="text" required maxlength="120"
                 placeholder="例如：每日活跃用户" />
        </label>
        <p id="save-sql-error" class="error" hidden></p>
        <menu>
          <button id="btn-save-sql-cancel" type="button">取消</button>
          <button id="btn-save-sql-submit" type="submit">保存</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
