# pnpm 11 默认拦截依赖的构建脚本（安全默认值）。
# 这里必须显式放行：它们的 postinstall 负责准备本机二进制。
#   - electron          : 下载 Electron.app 运行时；不放行则主进程无法启动
#   - esbuild           : 校验并链接平台二进制（vite 的构建底座）
#   - electron-winstaller: 只为 Windows 打包准备工具（不打包 Win 时不会用到）
allowBuilds:
  esbuild: true
  electron: true
  electron-winstaller: true
  # ssh2 / cpu-features 只提供**可选**的原生加速（加密运算）。
  # ssh2 的 install.js 会尝试编译 cpu-features；编译失败或不编译时，
  # ssh2 自动退回纯 JS 实现，功能完全不变（实测可用）。
  # 显式设为 false 而不是留空：留空会让 `pnpm install` 以
  # ERR_PNPM_IGNORED_BUILDS 非零退出，CI 会直接挂掉。
  cpu-features: false
  ssh2: false
minimumReleaseAgeExclude:
  - electron@45.0.0
