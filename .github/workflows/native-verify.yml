name: native-verify

on:
  # PRs and main pushes enter through verify.yml; releases reuse the full suite.
  workflow_dispatch:
    inputs:
      scope:
        description: 'Full native checks, databases or SQL security diagnosis'
        type: choice
        options: [all, databases, sql-security]
        default: all
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '1'
  RUST_TEST_THREADS: '1'
  # Native checks do not use the legacy Electron runtime.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  desktop-macos:
    if: github.event_name != 'workflow_dispatch' || (inputs.scope != 'databases' && inputs.scope != 'sql-security')
    name: macOS native desktop and production build
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: brew install pkg-config openssl@3 libssh2
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check desktop and root TypeScript
        run: pnpm typecheck
      - name: Test MySQL acceptance storage regressions
        run: node --test scripts/mysql-acceptance-storage.test.mjs
      - name: Check native architecture boundaries
        run: pnpm test:native-architecture
      - name: Test native candidate integrity and tamper rejection
        run: pnpm test:native-release
      - name: Test Vue parameter and data precision regressions
        run: pnpm test:native-ui-models
      - name: Test native database execution evidence gate
        run: node --test scripts/native-test-output.test.mjs
      - name: Test native host execution evidence gate
        run: node --test scripts/native-host-test-gate.test.mjs
      - name: Test portable Rust workspace
        run: cargo test --locked --workspace --exclude dbstudio-desktop
      - name: Test desktop shell library
        run: cargo test --locked -p dbstudio-desktop --lib
      - name: Test MySQL acceptance host contracts
        run: pnpm test:native-host
      - name: Build Vue with explicit desktop test controller
        env:
          VITE_DBSTUDIO_TEST_HOOKS: '1'
        run: pnpm build:desktop
      - name: Build actual Tauri host with test hooks
        run: pnpm exec tauri build --debug --features test-hooks --no-bundle --ci
      - name: Exercise actual macOS WebView and Rust backend
        run: pnpm test:native-desktop
      - name: Build fresh production desktop without test hooks
        # The root wrapper uses a new frontend directory and rejects test-hooks.
        # No signing/publishing credentials are required for --no-bundle.
        run: pnpm build --no-bundle
      - name: Require the native production executable
        run: |
          test -x target/release/dbstudio-desktop
          file target/release/dbstudio-desktop

  native-databases:
    name: Dedicated real database and TLS fixtures
    needs: desktop-macos
    if: ${{ !cancelled() && (needs.desktop-macos.result == 'success' || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'databases' || inputs.scope == 'sql-security'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Leave capacity for database containers while compiling native clients.
      CARGO_BUILD_JOBS: '1'
      DBSTUDIO_PAGE_PERF_DIR: ${{ github.workspace }}/out/page-performance
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native driver and fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libssl-dev libssh2-1-dev openssl openssh-client fonts-noto-cjk
      - name: Require Docker engine
        run: docker info --format '{{.ServerVersion}}'
      - name: Install locked frontend dependencies for real page rendering
        if: inputs.scope != 'sql-security'
        run: pnpm install --frozen-lockfile
      - name: Compile locked native driver integration tests
        run: cargo test --locked -p dbstudio-drivers --tests --no-run
      - name: Verify real PostgreSQL and MySQL native drivers
        if: inputs.scope != 'sql-security'
        # Creates random private fixture credentials, runs ignored live tests, then stops
        # only containers whose immutable IDs and per-run labels have been checked.
        run: node scripts/native-database-fixture.mjs
      - name: Measure real native pages in installed GitHub Chrome
        if: inputs.scope != 'sql-security'
        # Native timings and already-arrived page -> UI ready timings stay separate.
        # Uses playwright-core with channel chrome; never downloads a browser.
        timeout-minutes: 15
        run: node scripts/grid-page-performance.mjs
      - name: Verify real Redis TLS and Kafka TLS SASL
        if: inputs.scope != 'sql-security'
        # Sequential with SQL fixtures to bound memory. Never use --prepare-only as a gate.
        # Private backups/, certificates, env files and container logs are not uploaded.
        run: node scripts/native-secure-fixture.mjs
      - name: Verify real SQL TLS and pinned SSH with independent cancellation
        # Includes trusted-CA hostname failures and explicit MySQL SSH verify-full limitation.
        run: node scripts/native-sql-secure-fixture.mjs
      - name: Upload public pagination performance evidence only
        if: always() && inputs.scope != 'sql-security'
        uses: actions/upload-artifact@v4
        with:
          name: native-page-performance
          path: out/page-performance/
          if-no-files-found: error
          retention-days: 14
