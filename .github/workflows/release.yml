name: native-release-candidates

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  CARGO_BUILD_JOBS: '2'

jobs:
  verify:
    uses: ./.github/workflows/native-verify.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: mac-arm64
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            name: win-x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-24.04
            name: linux-x64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config libssl-dev libssh2-1-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config openssl@3 libssh2
      - name: Check version and trigger
        run: node scripts/check-release-version.mjs
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build fresh production Tauri installers
        run: pnpm build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Record candidate identity and installer hashes
        run: node scripts/native-release-gate.mjs manifest ${{ matrix.name }} target/${{ matrix.target }}/release/bundle native-candidates/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-candidates/${{ matrix.name }}/
          if-no-files-found: error

  gate:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: downloaded
      - name: Arrange the exact three native targets
        run: |
          mkdir candidates
          cp -R downloaded/native-mac-arm64-${{ github.run_id }}-${{ github.run_attempt }} candidates/mac-arm64
          cp -R downloaded/native-win-x64-${{ github.run_id }}-${{ github.run_attempt }} candidates/win-x64
          cp -R downloaded/native-linux-x64-${{ github.run_id }}-${{ github.run_attempt }} candidates/linux-x64
      - name: Require matching source, version, workflow attempt and hashes
        run: node scripts/native-release-gate.mjs aggregate candidates
      - uses: actions/upload-artifact@v4
        with:
          name: verified-native-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidates/
          if-no-files-found: error
      - name: Record acceptance boundary
        run: echo 'Native candidate integrity verified. Installer execution, signing and notarization require platform acceptance before publication.'
