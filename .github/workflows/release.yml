name: native-release-candidates

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  CARGO_BUILD_JOBS: '2'

jobs:
  verify:
    uses: ./.github/workflows/native-verify.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: mac-arm64
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            name: win-x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config openssl@3 libssh2
      - name: Check version and trigger
        run: node scripts/check-release-version.mjs
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build fresh production Tauri installers
        run: pnpm build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Record candidate identity and installer hashes
        run: node scripts/native-release-gate.mjs manifest ${{ matrix.name }} target/${{ matrix.target }}/release/bundle native-candidates/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-candidates/${{ matrix.name }}/
          if-no-files-found: error

  gate:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: downloaded
      - name: Arrange the macOS and Windows candidates
        run: |
          mkdir candidates
          cp -R downloaded/native-mac-arm64-${{ github.run_id }}-${{ github.run_attempt }} candidates/mac-arm64
          cp -R downloaded/native-win-x64-${{ github.run_id }}-${{ github.run_attempt }} candidates/win-x64
      - name: Require matching source, version, workflow attempt and hashes
        run: node scripts/native-release-gate.mjs aggregate candidates
      - uses: actions/upload-artifact@v4
        with:
          name: verified-native-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidates/
          if-no-files-found: error
      - name: Record acceptance boundary
        run: echo 'Native candidate integrity verified. Platform acceptance is recorded separately.'

  windows-installer-acceptance:
    name: Windows installer and MySQL reconnect acceptance
    needs: gate
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: verified-native-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidates
      - name: Verify candidate identity and hashes before running installers
        run: node scripts/native-release-gate.mjs verify candidates
      - name: Download the v0.8.1 Windows baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'dbstudio-baseline'
          gh release download v0.8.1 --repo $env:GITHUB_REPOSITORY --pattern 'dbstudio_0.8.1_x64-setup.exe' --dir $destination
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, save a MySQL connection, and reconnect after replacement
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'dbstudio-baseline\dbstudio_0.8.1_x64-setup.exe'
          $manifest = Get-Content -LiteralPath 'candidates/win-x64/manifest.json' -Raw | ConvertFrom-Json
          $candidate = Join-Path $PWD ('candidates/win-x64/' + $manifest.files[0].name)
          $report = Join-Path $env:RUNNER_TEMP 'dbstudio-windows-acceptance.json'
          ./scripts/windows-install-acceptance.ps1 -BaselineInstaller $baseline -CandidateInstaller $candidate -ReportPath $report
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: windows-installer-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dbstudio-windows-acceptance.json
          if-no-files-found: ignore
