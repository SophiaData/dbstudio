name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
            executable: release/mac-arm64/dbstudio.app/Contents/MacOS/dbstudio
          - os: macos-15-intel
            platform: mac
            arch: x64
            executable: release/mac/dbstudio.app/Contents/MacOS/dbstudio
          - os: windows-latest
            platform: win
            arch: x64
            executable: release/win-unpacked/dbstudio.exe
          - os: ubuntu-latest
            platform: linux
            arch: x64
            executable: release/linux-unpacked/dbstudio
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Check version and trigger
        run: node scripts/check-release-version.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Build native packages without publishing
        run: pnpm exec electron-builder --config electron-builder.config.mjs --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Packaged application smoke (macOS and Windows)
        if: matrix.platform != 'linux'
        run: node scripts/smoke-packaged-app.mjs ${{ matrix.platform }} ${{ matrix.arch }} "${{ matrix.executable }}" smoke.json
      - name: Packaged application smoke (Linux)
        if: matrix.platform == 'linux'
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum node scripts/smoke-packaged-app.mjs linux x64 "${{ matrix.executable }}" smoke.json
      - name: Validate package files and write manifest
        run: node scripts/release-gate.mjs manifest ${{ matrix.platform }} ${{ matrix.arch }} release smoke.json bundle
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: bundle/
          if-no-files-found: error
      - name: Preserve smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.platform }}-${{ matrix.arch }}
          path: smoke.json*
          if-no-files-found: warn

  gate:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: version
        run: node scripts/check-release-version.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - name: Require every target from this commit and workflow attempt
        run: node scripts/release-gate.mjs aggregate artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: verified-bundles
          path: artifacts/
          if-no-files-found: error

  publish:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: verified-bundles
          path: artifacts
      - name: Verify downloaded bundles again
        run: node scripts/release-gate.mjs aggregate artifacts
      - name: Upload draft, verify all attachments, then publish once
        uses: actions/github-script@v7
        with:
          script: |
            const { readFile } = await import('node:fs/promises')
            const { pathToFileURL } = await import('node:url')
            const { publishRelease } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/publish-release.mjs`).href)
            const gate = JSON.parse(await readFile('artifacts/gate.json', 'utf8'))
            await publishRelease({ github, ...context.repo, gate })
