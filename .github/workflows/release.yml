# 发布构建：打 tag 时自动为三个平台出安装包并上传到 GitHub Release
#
# ===== 为什么必须用 CI 而不是本地打 =====
#
# electron-builder 可以跨平台打包，但**不可靠**：
#   - Windows 的 NSIS 安装器在 macOS 上打需要 wine
#   - macOS 的签名/公证只能在 macOS 上做
#   - Linux 的 AppImage 在 macOS 上打容易缺库
# 官方明确建议「每个平台在各自的 runner 上打」。
#
# 所以这里用 matrix：每个平台跑在自己的原生 runner 上。
#
# 触发方式：推送形如 v0.1.0 的 tag。

name: release

on:
  push:
    tags:
      - 'v*'
  # 允许手动触发，便于先验证流程而不发版
  workflow_dispatch:

jobs:
  # 发版前先跑一遍验证，避免把测试不过的版本发出去
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # 每个条目跑在一个原生 runner 上。
          # macOS 的 electron-builder 一次会同时产出 dmg 与 zip，
          # 所以一个平台只需一条，不要按产物拆成两条（会重复构建、白烧 runner 时间）。
          - os: macos-latest
            platform: mac
            # 多个 glob 用 YAML 多行标量（| 或 >-）；这里用 |- 保持换行
            artifacts: |-
              release/*.dmg
              release/*.zip
          - os: windows-latest
            platform: win
            artifacts: 'release/*.exe'
          - os: ubuntu-latest
            platform: linux
            artifacts: 'release/*.AppImage'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: 版本门禁：tag 必须与 package.json 一致
        # ===== 为什么必须有这道门 =====
        #
        # 版本号只有一个真相来源：package.json。tag 只是它的镜像。
        # 早先 tag 与 package.json 由两个人手工维护，漂移时**没有任何报错**——
        # 用户拿到的是「v0.4.0」的 tag，装的却是别的东西。
        #
        # 这里在打包**之前**拦住：版本对不上就不产出任何安装包，
        # 而不是产出一堆装不上的东西再让人去猜。
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          NORMALIZED="${TAG#v}"
          echo "tag = $TAG，package.json version = $VERSION"
          if [ "$NORMALIZED" != "$VERSION" ]; then
            echo "::error::tag ($TAG) 与 package.json version ($VERSION) 不一致，拒绝打包"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm run build

      - name: 打包（macOS）
        if: matrix.platform == 'mac'
        run: npx electron-builder --config electron-builder.config.mjs --mac --publish never

      - name: 打包（Windows）
        if: matrix.platform == 'win'
        run: npx electron-builder --config electron-builder.config.mjs --win --publish never

      - name: 打包（Linux）
        if: matrix.platform == 'linux'
        run: npx electron-builder --config electron-builder.config.mjs --linux --publish never

      - name: 上传产物到 Release
        uses: softprops/action-gh-release@v2
        with:
          # ★ glob 用**换行**分隔，不要用空格。
          # softprops/action-gh-release 把 files 当多行 glob 解析；
          # 写成一行 `release/*.dmg release/*.zip` 时它会把整串当成一个模式，
          # 结果匹配不到、又不报错（fail_on_unmatched_files: false），
          # 表现为「job 绿了但 macOS 产物没上传」——正是踩过的坑。
          files: |
            ${{ matrix.artifacts }}
          draft: false
          # 明确要求至少匹配到一个文件：宁可报错，也不要静默漏传
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
