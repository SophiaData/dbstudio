name: Windows MySQL SQL editor acceptance

on:
  push:
    branches: [ci/mysql-editor-tabs-acceptance]

permissions:
  contents: read
  actions: read

env:
  CANDIDATE_BUILD_RUN: '44875846793'
  CANDIDATE_BUILD_SHA: 'ba6379c50d0cfaf5652f55df5993a942c61fcae9'
  CANDIDATE_BUILD_BRANCH: 'feat/mysql-sql-editor-tabs'

jobs:
  installed-ui:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the source build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_BUILD_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/release.yml' -or
              $run.head_branch -ne $env:CANDIDATE_BUILD_BRANCH -or $run.head_sha -ne $env:CANDIDATE_BUILD_SHA -or
              $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY) {
            throw 'The candidate was not produced by the expected successful feature build.'
          }
          "attempt=$($run.run_attempt)" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.CANDIDATE_BUILD_RUN }}
          name: verified-native-candidates-${{ env.CANDIDATE_BUILD_RUN }}-${{ steps.source.outputs.attempt }}
          path: candidates
      - name: Verify the feature candidate before running it
        env:
          CANDIDATE_ATTEMPT: ${{ steps.source.outputs.attempt }}
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_BUILD_SHA
          $env:GITHUB_RUN_ID = $env:CANDIDATE_BUILD_RUN
          $env:GITHUB_RUN_ATTEMPT = $env:CANDIDATE_ATTEMPT
          node scripts/native-release-gate.mjs verify candidates
          exit $LASTEXITCODE
      - name: Verify SQL tabs against two MySQL databases
        run: |
          $candidate = Join-Path $PWD 'candidates\win-x64\dbstudio_0.8.1_x64-setup.exe'
          $env:GITHUB_SHA = $env:CANDIDATE_BUILD_SHA
          $report = Join-Path $env:RUNNER_TEMP 'dbstudio-windows-acceptance.json'
          pwsh -NoProfile -Sta -File ./scripts/windows-install-acceptance.ps1 -FirstUse -EditorTabsOnly -CandidateInstaller $candidate -ReportPath $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed' -or $result.scenario -ne 'mysql_editor_tabs' -or
              $result.checks.independentEditorTargets -ne $true -or $result.checks.restoredEditorDrafts -ne $true) {
            throw 'The candidate must pass MySQL target isolation and draft restoration.'
          }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: windows-uia-probe
          path: ${{ runner.temp }}/dbstudio-windows-acceptance.json
          if-no-files-found: ignore
