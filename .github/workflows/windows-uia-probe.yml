name: Windows installed UI probe

on:
  push:
    branches: [ci/windows-installer-uia-probe]

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  CARGO_BUILD_JOBS: '1'

jobs:
  installed-ui:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and record the Windows candidate
        run: |
          pnpm build --ci --target x86_64-pc-windows-msvc --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/native-release-gate.mjs manifest win-x64 target/x86_64-pc-windows-msvc/release/bundle candidates/win-x64
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: native-win-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidates/win-x64/
          if-no-files-found: error
      - name: Download the v0.8.1 Windows baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.8.1 --repo $env:GITHUB_REPOSITORY --pattern 'dbstudio_0.8.1_x64-setup.exe' --dir (Join-Path $env:RUNNER_TEMP 'dbstudio-baseline')
          exit $LASTEXITCODE
      - name: Inspect the candidate on a clean Windows installation
        env:
          DBSTUDIO_PROBE_CANDIDATE_STARTUP: '1'
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'dbstudio-baseline\dbstudio_0.8.1_x64-setup.exe'
          $candidate = Join-Path $PWD 'candidates\win-x64\dbstudio_0.8.1_x64-setup.exe'
          $report = Join-Path $env:RUNNER_TEMP 'dbstudio-windows-acceptance.json'
          ./scripts/windows-install-acceptance.ps1 -BaselineInstaller $baseline -CandidateInstaller $candidate -ReportPath $report
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: windows-uia-probe
          path: ${{ runner.temp }}/dbstudio-windows-acceptance.json
          if-no-files-found: ignore
