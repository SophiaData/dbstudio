name: Windows installed candidate acceptance

on:
  push:
    branches: [ci/windows-installed-candidate]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Reuse a saved candidate from this workflow run; blank builds a new candidate'
        required: false
        type: string
      candidate_run_attempt:
        description: 'Source run attempt when reusing a candidate'
        default: '1'
        type: string
  workflow_call:

permissions:
  contents: read
  actions: read

env:
  CARGO_BUILD_JOBS: '1'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id || '' }}
  CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt || '1' }}

jobs:
  acceptance:
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        if: env.CANDIDATE_RUN_ID == ''
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ env.CANDIDATE_RUN_ID == '' && 'pnpm' || '' }}
      - name: Validate the saved candidate source
        if: env.CANDIDATE_RUN_ID != ''
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const runId = process.env.CANDIDATE_RUN_ID;
            const attempt = process.env.CANDIDATE_RUN_ATTEMPT;
            if (!/^[1-9][0-9]*$/.test(runId) || !/^[1-9][0-9]*$/.test(attempt)) {
              throw new Error('Invalid candidate run identity');
            }
            const { data: run } = await github.rest.actions.getWorkflowRunAttempt({
              ...context.repo, run_id: Number(runId), attempt_number: Number(attempt)
            });
            if (run.path !== '.github/workflows/windows-installed-candidate.yml' ||
                run.event !== 'workflow_dispatch' || run.status !== 'completed' ||
                run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Candidate must come from a completed manual run in this repository');
            }
            await exec.exec('git', ['merge-base', '--is-ancestor', run.head_sha, context.sha]);
            const diff = await exec.getExecOutput('git', ['diff', '--name-only', run.head_sha, context.sha], { silent: true });
            const allowed = new Set([
              '.github/workflows/windows-installed-candidate.yml',
              '.github/workflows/verify.yml',
              'scripts/windows-installed-candidate.ps1',
              'scripts/windows-mysql-acceptance.ps1'
            ]);
            if (diff.stdout.trim().split(/\r?\n/).filter(Boolean).some(path => !allowed.has(path))) {
              throw new Error('Application source changed: build a new candidate');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: Number(runId), per_page: 100
            });
            const pending = `windows-x64-unverified-${runId}-${attempt}`;
            const accepted = `windows-x64-accepted-${runId}-${attempt}`;
            const artifact = artifacts.find(item => item.name === pending && !item.expired) ||
              artifacts.find(item => item.name === accepted && !item.expired);
            if (!artifact || artifact.size_in_bytes <= 0) throw new Error('Saved candidate is unavailable');
            core.setOutput('artifact', artifact.name);
            core.setOutput('directory', artifact.name === pending ? 'retrieved-candidate' : 'retrieved-candidate/native-candidates/win-x64');
            core.exportVariable('DBSTUDIO_CANDIDATE_SHA', run.head_sha);
            core.exportVariable('DBSTUDIO_CANDIDATE_RUN_ID', runId);
            core.exportVariable('DBSTUDIO_CANDIDATE_RUN_ATTEMPT', attempt);
      - name: Download the saved candidate
        if: env.CANDIDATE_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: retrieved-candidate
      - name: Verify and stage the saved installer
        if: env.CANDIDATE_RUN_ID != ''
        shell: pwsh
        env:
          SAVED_CANDIDATE_DIRECTORY: ${{ steps.source.outputs.directory }}
        run: |
          @'
          import { cp, readFile } from 'node:fs/promises';
          import { verifyCandidate } from './scripts/native-release-gate.mjs';
          const { version } = JSON.parse(await readFile('package.json', 'utf8'));
          await verifyCandidate(process.env.SAVED_CANDIDATE_DIRECTORY, 'win-x64', {
            version, sha: process.env.DBSTUDIO_CANDIDATE_SHA,
            runId: process.env.DBSTUDIO_CANDIDATE_RUN_ID,
            runAttempt: process.env.DBSTUDIO_CANDIDATE_RUN_ATTEMPT
          });
          await cp(process.env.SAVED_CANDIDATE_DIRECTORY, 'native-candidates/win-x64', {
            recursive: true, force: false, errorOnExist: true
          });
          console.log('Saved installer identity and SHA-256 verified; no application rebuild.');
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw 'Saved candidate verification failed.' }
      - uses: dtolnay/rust-toolchain@stable
        if: env.CANDIDATE_RUN_ID == ''
        with:
          targets: x86_64-pc-windows-msvc
      - name: Reuse compiled Rust dependencies
        if: env.CANDIDATE_RUN_ID == ''
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-installed-x64
          workspaces: '. -> target'
      - name: Install locked frontend dependencies
        if: env.CANDIDATE_RUN_ID == ''
        run: pnpm install --frozen-lockfile
      - name: Build the production Windows candidate
        if: env.CANDIDATE_RUN_ID == ''
        run: pnpm build --ci --no-sign --target x86_64-pc-windows-msvc --bundles nsis
      - name: Create the Windows candidate manifest
        if: env.CANDIDATE_RUN_ID == ''
        run: node scripts/native-release-gate.mjs manifest win-x64 target/x86_64-pc-windows-msvc/release/bundle native-candidates/win-x64
      - name: Save the unverified candidate before UI acceptance
        if: env.CANDIDATE_RUN_ID == ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-unverified-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-candidates/win-x64/
          if-no-files-found: error
      - name: Install the candidate and verify it against isolated MySQL
        shell: pwsh
        run: |
          pwsh -NoProfile -Sta -File ./scripts/windows-mysql-acceptance.ps1 -CandidateDirectory ./native-candidates/win-x64
      - name: Save the acceptance report, including failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-acceptance.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-accepted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-candidates/win-x64/
            candidate-acceptance.json
          if-no-files-found: error
