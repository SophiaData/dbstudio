name: Windows desktop and MySQL acceptance

on:
  push:
    branches: [ci/windows-mysql-acceptance]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '1'
  CARGO_PROFILE_DEV_DEBUG: '0'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  acceptance:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache/restore@v4
        id: rust-build-cache
        with:
          path: |
            ~/.cargo/registry
            target/debug
          key: dbstudio-win-mysql-v1-${{ hashFiles('Cargo.lock') }}
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the Windows acceptance frontend
        env:
          VITE_DBSTUDIO_TEST_HOOKS: '1'
          VITE_DBSTUDIO_WINDOWS_MYSQL: '1'
        run: pnpm build:desktop
      - name: Check editor and execution regressions
        run: |
          node apps/desktop/tests/editor-regressions.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/desktop/tests/sql-workflow-regressions.mjs
      - name: Build the actual Windows Tauri host
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'dbstudio-acceptance-config.json'
          '{"identifier":"io.dbstudio.windows-mysql-smoke"}' | Set-Content -LiteralPath $config -Encoding utf8NoBOM
          pnpm exec tauri build --debug --features test-hooks --no-bundle --ci --config $config
      - name: Verify native report contracts
        run: cargo test --locked -p dbstudio-desktop --lib --features test-hooks smoke::tests:: -- --test-threads=1
      - uses: actions/cache/save@v4
        if: steps.rust-build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            target/debug
          key: dbstudio-win-mysql-v1-${{ hashFiles('Cargo.lock') }}
      - name: Verify Windows WebView against isolated MySQL and replay exported SQL
        shell: pwsh
        run: ./scripts/windows-mysql-acceptance.ps1
      - name: Save editor performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-performance-${{ github.run_id }}
          path: editor-performance.json
          if-no-files-found: warn
