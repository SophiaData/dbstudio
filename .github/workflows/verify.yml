name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: 'Run every check (candidate installation remains separate)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  changes:
    name: Plan and validate CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      node: ${{ steps.plan.outputs.node }}
      frontend: ${{ steps.plan.outputs.frontend }}
      native: ${{ steps.plan.outputs.native }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test routing and fail-closed result aggregation
        run: node --test --test-concurrency=1 scripts/ci-routing.test.mjs
      - name: Validate workflow syntax and expressions
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          -shellcheck= -pyflakes=
          .github/workflows/verify.yml
          .github/workflows/native-verify.yml
          .github/workflows/windows-mysql-acceptance.yml
          .github/workflows/windows-installed-candidate.yml
      - name: Select checks from the complete Git diff
        id: plan
        env:
          CI_FULL: ${{ github.event_name == 'workflow_dispatch' || inputs.full == true }}
        run: node scripts/ci-plan.mjs

  node:
    name: Node checks
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          # ===== 为什么用 trust 认证 =====
          #
          # test:gui-explain-postgres 的流程是「连接 → 断开 → 重连」。断开时
          # ConnectionManager 会删掉内存里的密码（#sessionSecrets.delete），
          # safeStorage 加密，Linux 无桌面 keyring 时 safeStorage 不可用，
          # 密码存不住（日志会打印"密码未保存（安全存储不可用）"）。
          # 于是重连没有密码，scram 认证必然失败：
          #   SASL: SCRAM-SERVER-FIRST-MESSAGE: client password must be a string
          #
          # 这是 CI 环境的限制，不是产品缺陷：产品的行为是"存不了密码就提示
          # 用户重输"，本身正确。而这里只需要一个能连上的测试库，
          # trust 认证让重连不依赖密码持久化，从而仍能真实验证重连链路。
          #
          # 不会因为这里放宽而失去验证。
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # 等健康检查通过再跑后续步骤，避免"连接被拒"的偶发失败。
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # 用**空密码**（MYSQL_ALLOW_EMPTY_PASSWORD）而不是密码认证，原因与 PG 用 trust 相同：
      # test 在 add 时把 secret 交给 ConnectionStore，Linux CI 无 keyring 存不住密码，
      # 重连会拿不到口令。空密码让测试不依赖密码持久化，仍能真实跑驱动。
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: testdb
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Node contracts, types and core unit tests
        # The manifest already includes test:core-unit; do not run it a second time.
        run: pnpm run verify:node

  frontend:
    name: Vue component and model checks
    needs: [changes, node]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          needs.changes.outputs.frontend == 'true' && needs.node.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:native-architecture
      - run: pnpm test:native-ui-models

  native:
    name: Native and real database checks
    needs: [changes, node, frontend]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          needs.changes.outputs.native == 'true' &&
          needs.node.result == 'success' && needs.frontend.result == 'success' }}
    uses: ./.github/workflows/native-verify.yml

  windows:
    name: Windows WebView checks
    needs: [changes, node, frontend, native]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          needs.changes.outputs.windows == 'true' &&
          needs.node.result == 'success' && needs.frontend.result == 'success' &&
          (needs.native.result == 'success' ||
           (needs.changes.outputs.native == 'false' && needs.native.result == 'skipped')) }}
    uses: ./.github/workflows/windows-mysql-acceptance.yml

  ci:
    name: CI gate
    if: always()
    needs: [changes, node, frontend, native, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require every selected check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs
