# CI：在干净环境里跑一遍 `pnpm verify`
#
# 为什么值得加这一条：本地开发时 node_modules / out / fixtures 都是现成的，
# 很容易出现「在我机器上能过」。这个 workflow 从零安装、重新生成夹具、
# 是「这个仓库克隆下来真的能跑」的唯一客观证据。
#

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 允许 release.yml 用 `uses: ./.github/workflows/verify.yml` 复用本流程：
  # 发版前必须先验证通过，避免把测试挂掉的版本发出去。
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest

    # ★ PostgreSQL 服务容器：让 PG 测试在 CI 里**真跑**，而不是被跳过。
    #
    # DBSTUDIO_PG_URL，于是每次走"缺环境→exit 0"的跳过分支。
    # 结果是 CI 全绿，但 **PG 驱动从来没在 CI 里被真正验证过** ——
    # 谁改坏了 PG，CI 照样绿，只有本地手动起过 PG 的人才会发现。
    # 这种"绿得没有说服力"的 CI 比没有 CI 更危险。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          # ===== 为什么用 trust 认证 =====
          #
          # test:gui-explain-postgres 的流程是「连接 → 断开 → 重连」。断开时
          # ConnectionManager 会删掉内存里的密码（#sessionSecrets.delete），
          # safeStorage 加密，Linux 无桌面 keyring 时 safeStorage 不可用，
          # 密码存不住（日志会打印"密码未保存（安全存储不可用）"）。
          # 于是重连没有密码，scram 认证必然失败：
          #   SASL: SCRAM-SERVER-FIRST-MESSAGE: client password must be a string
          #
          # 这是 CI 环境的限制，不是产品缺陷：产品的行为是"存不了密码就提示
          # 用户重输"，本身正确。而这里只需要一个能连上的测试库，
          # trust 认证让重连不依赖密码持久化，从而仍能真实验证重连链路。
          #
          # 不会因为这里放宽而失去验证。
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # 等健康检查通过再跑后续步骤，避免"连接被拒"的偶发失败。
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # 用**空密码**（MYSQL_ALLOW_EMPTY_PASSWORD）而不是密码认证，原因与 PG 用 trust 相同：
      # test 在 add 时把 secret 交给 ConnectionStore，Linux CI 无 keyring 存不住密码，
      # 重连会拿不到口令。空密码让测试不依赖密码持久化，仍能真实跑驱动。
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: testdb
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        # 注意：不要在 CI 里重写 pnpm-workspace.yaml。
        # 仓库里那份已经包含两件必需的东西：
        #     "发布不足 X 小时" 的包，这个版本发布太新，必须显式豁免）
        # 早先这里用脚本重写 yaml，结果把 minimumReleaseAgeExclude 抹掉了，
        # CI 直接挂在 lockfile 供应链校验上。教训：CI 不要改仓库里的锁/配置。
        run: pnpm install --frozen-lockfile

      - name: 纯 Node 验证
        # 跑 `node` 分组——它就是清单里的纯 Node 步骤。
        #
        # ===== 为什么不直接 `pnpm verify` =====
        #
        # `external` 分组需要先起 PG/sshd（见后面的步骤）。
        # 所以这里按分组跑，但**清单本身是同一份**
        # （scripts/verify-manifest.mjs），不是在这里手抄一遍。
        #
        # 早先这里是手抄的步骤列表，加测试只改一边就会静默漏跑——
        # 而且不报错，只是悄悄少验证了一件事。
        run: pnpm run verify:node

      - name: 核心单测（单 worker）
        run: pnpm run test:core-unit --maxWorkers=1 --no-file-parallelism

  native:
    name: Native checks after Node verification
    if: github.event_name == 'pull_request'
    needs: verify
    uses: ./.github/workflows/native-verify.yml

  windows-mysql:
    name: Windows WebView after native checks
    if: github.event_name == 'pull_request'
    needs: native
    uses: ./.github/workflows/windows-mysql-acceptance.yml

  windows-installed:
    name: Windows installed candidate after WebView checks
    if: github.event_name == 'pull_request'
    needs: windows-mysql
    uses: ./.github/workflows/windows-installed-candidate.yml
