# CI：在干净环境里跑一遍 `pnpm verify`
#
# 为什么值得加这一条：本地开发时 node_modules / out / fixtures 都是现成的，
# 很容易出现「在我机器上能过」。这个 workflow 从零安装、重新生成夹具、
# 跑全部 232 条断言 + Electron 内置 Node 验证 + GUI 自检，
# 是「这个仓库克隆下来真的能跑」的唯一客观证据。
#
# 注意 GUI 自检需要显示环境；Linux CI 上用 xvfb 提供虚拟显示。

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 允许 release.yml 用 `uses: ./.github/workflows/verify.yml` 复用本流程：
  # 发版前必须先验证通过，避免把测试挂掉的版本发出去。
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        # 注意：不要在 CI 里重写 pnpm-workspace.yaml。
        # 仓库里那份已经包含两件必需的东西：
        #   - allowBuilds: electron / esbuild 的 postinstall 需要跑（下载本机二进制）
        #   - minimumReleaseAgeExclude: electron@45.0.0（pnpm 供应链策略默认拒绝
        #     "发布不足 X 小时" 的包，这个版本发布太新，必须显式豁免）
        # 早先这里用脚本重写 yaml，结果把 minimumReleaseAgeExclude 抹掉了，
        # CI 直接挂在 lockfile 供应链校验上。教训：CI 不要改仓库里的锁/配置。
        run: pnpm install --frozen-lockfile

      - name: 类型检查 + 构建 + 全部 e2e（不含 GUI）
        # 注意这里刻意**逐段列出**而不是直接 `pnpm verify`：
        # `verify` 末尾包含 test:gui，而 GUI 需要显示环境。
        # 在无头 CI 上直接跑 verify 会挂在 GUI 那一步（错误信息还很难懂）。
        # 所以这里跑除 GUI 以外的全部，GUI 放到下一步用 xvfb 单独跑。
        run: |
          pnpm run typecheck
          pnpm run build
          pnpm run fixture
          pnpm run test
          pnpm run test:resultset
          pnpm run test:edit
          pnpm run test:persist
          pnpm run test:electron

      - name: GUI 自检（xvfb 提供虚拟显示）
        # --no-sandbox 的来历（Linux CI 常见坑）：
        # Electron 的 chrome-sandbox 需要 root 所有且权限为 4755 才能启用 SUID 沙箱。
        # GitHub Actions 的 runner 上安装出来的 chrome-sandbox 不满足这两个条件，
        # Electron 直接 FATAL 退出："The SUID sandbox helper binary was found,
        # but is not configured correctly. Rather than run without sandboxing I'm aborting now."
        #
        # 这里关掉沙箱是**测试环境的合理妥协**：我们只在 CI 里跑一次自检，
        # 加载的是自己刚构建的本地页面，不访问外部不受信内容。
        # 生产运行不经过这个脚本，不受影响。
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum pnpm test:gui

      - name: GUI 真实交互测试（Playwright 驱动 Electron）
        # 上一步只验证「界面起来了」；这一步像真人一样点击操作：
        # 新建连接 → 展开树 → 点表看数据 → 双击改单元格 → 应用 → 提交 → 验证落库。
        # 用 playwright-core（不下载浏览器），仅用它的 Electron 支持。
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum pnpm test:gui-flow

      - name: 新功能 GUI 交互测试
        # 覆盖本轮补齐的能力：树搜索 / 排序 / 列宽 / 统计行数 / CSV /
        # 新增行 / 删除行 / 右键菜单。与上一步分开，失败时能一眼定位。
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum pnpm test:gui-features
