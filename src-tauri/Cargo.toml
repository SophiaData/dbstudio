[package]
name = "dbstudio-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "dbstudio_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
# Explicit opt-in only; release builds must not enable this feature.
test-hooks = ["dep:rusqlite"]
# Isolated debug-only host; depends on test-hooks so the existing release gate remains authoritative.
mysql-acceptance = ["test-hooks", "dep:security-framework"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dbstudio-core = { path = "../crates/dbstudio-core" }
dbstudio-protocol = { path = "../crates/dbstudio-protocol" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# Typed OSStatus observation for the isolated acceptance host only; the same 3.7.0 version keyring already resolves transitively.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", optional = true, default-features = false }
